probes:
- host: login.funnel.io
  path: /.well-known/openid-configuration
  status: 200
  content_type: application/json
  file: funnel-login-openid-configuration.json
  note: >-
    Real OIDC discovery document. issuer https://login.funnel.io/, token_endpoint
    https://login.funnel.io/oauth/token, registration_endpoint https://login.funnel.io/oidc/register
    (RFC 7591 dynamic client registration), PKCE S256 supported. This is the Auth0 tenant Funnel
    runs on its own domain and is the authorization server for BOTH the Control Plane API
    (client_credentials) and Funnel MCP (authorization_code).
