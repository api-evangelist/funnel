capacity_unit:
  name: flexpoint
  abbreviation: FP
  detail: >-
    Capacity is bought on top of any plan, via sales or in-product. Consumption rates published on
    the pricing page.
  consumption:
  - item: Connector (e.g. Facebook Ads, Google Analytics)
    cost: 50
  - item: Account / data source (e.g. ad account, GA4 property)
    cost: 5
  - item: Visualization destination (e.g. Looker Studio, Google Sheets)
    cost: 150
  - item: Data warehouse destination (e.g. BigQuery, Snowflake)
    cost: 300
  - item: Conversion API destination
