api_access:
  metered: false
  detail: >-
    Programmatic access is not sold as a separate tier or metered add-on. Funnel AI and Funnel MCP
    are listed as available on ALL plans, and Funnel states that Funnel MCP does not consume
    flexpoints. The Control Plane API (Terraform provider) is not named as a priced line item; it
    governs resources whose creation consumes flexpoints, which is why the API returns HTTP 403
    "Forbidden - limit reached" when capacity is exhausted.
add_ons:
- name: Funnel Measure
  pricing: custom
  detail: >-
    Measurement (marketing mix modeling, multi-touch attribution, incrementality testing) is priced
    separately based on ad spend and setup. Available as an add-on module on Business and
    Enterprise; not available on Starter.
free_tier: false
trial: false
self_serve_checkout: false
self_serve_note: >-
  Every tier routes to "Book a demo" or "Talk to sales". There is no published self-serve checkout
  and no free tier, so a developer cannot obtain credentials without a sales conversation.
notes: >-
  Read from Funnel's public pricing page on 2026-08-12. Two named tiers carry real published list
  prices; Enterprise is quote-only. The plan matrix also confirms two facts used elsewhere in this
  repo: EU data residency is an Enterprise-tier feature, and SAML/OIDC/SCIM SSO is Enterprise-only.
