missing_sdks:
  languages:
  - javascript
  - typescript
  - python
  - java
  - go
  - ruby
  - php
  - csharp
  detail: >-
    Funnel publishes NO conventional language SDK for any of its three programmatic surfaces. There
    is no client for the MCP server (none is needed — MCP clients are generic) and none for the file
    import webhook (a plain POST). For the Control Plane API the Terraform provider is the only
    client, and because the API enforces its User-Agent, writing an SDK in another language means
    impersonating that provider.
cli:
  first_party: false
  detail: >-
    No first-party Funnel CLI. The nearest equivalent is `terraform` driving the official provider.
