- name: Funnel MCP
  description: >-
    Funnel MCP is Funnel's first-party hosted, remote Model Context Protocol server. It exposes a
    Funnel workspace's harmonized cross-channel marketing data, semantic field definitions and
    workspace context to any MCP-compatible client (Claude, ChatGPT, Cursor, Copilot, Lovable,
    Perplexity, Notion) over streamable HTTP JSON-RPC. It publishes six read-only tools —
    list_workspaces, load_workspace, search_fields, get_dimension_values, prepare_data and
    query_data — and cannot create or change data sources, fields, dashboards, exports or any other
    Funnel configuration. Authentication is OAuth 2.0 authorization-code against Funnel's Auth0
    tenant at login.funnel.io, with RFC 7591 dynamic client registration and RFC 9728
    protected-resource metadata served anonymously. Regional servers exist for global and EU data
    residency, and the surface is available on all plans without consuming flexpoints.
  humanURL: https://funnel.io/funnel-mcp
  baseURL: https://mcp.ai.funnel.io/mcp
  tags:
  - MCP
  - AI Agents
  - Marketing Data
  - Analytics
  properties:
  - type: MCPServer
    url: mcp/funnel-mcp.yml
  - type: OAuthScopes
    url: scopes/funnel-scopes.yml
  - type: Authentication
    url: authentication/funnel-authentication.yml
  - type: AgentSkill
    url: skills/funnel-query-marketing-data.md
  - type: Quickstart
    url: https://help.funnel.io/en/articles/15014203-quick-start-guide-using-funnel-mcp
- name: Funnel File Import Webhook API
  description: >-
    The Funnel File Import Webhook API is a documented inbound HTTP endpoint that lets a customer
    hand Funnel links to data files for ingestion into a File Import data source. A per-source
    webhook URL and secret token are generated in the Funnel app; the consumer POSTs a JSON string or
    array of HTTPS links (publicly accessible or pre-signed) with the token in the
    x-funnel-fileimport-token header. Funnel then fetches and imports each file. CSV, TSV, XLSX and
    ZIP are supported, up to 1 GB per file, and published status codes cover 200, 400, 401 and 500.
    Funnel documents the older object-shaped request body as deprecated.
  humanURL: https://help.funnel.io/en/articles/8439795-file-import-webhook-api-documentation
  baseURL: https://fileimport-webhook.funnel.io
  tags:
  - Data Integration
  - File Import
  - Webhook
  tags_raw:
  - Data Integration
  - File Import
  - Webhooks
