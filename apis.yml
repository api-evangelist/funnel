apis:
- name: Funnel Control Plane API
  description: >-
    The Funnel Control Plane API provides configuration-management operations for a Funnel
    subscription — workspaces, data sources, custom dimensions and metrics, and data exports to
    BigQuery, Snowflake, Google Cloud Storage, and measurement destinations. It authenticates with
    OAuth 2.0 client-credentials (system user) via Auth0 and is offered on regional US and EU hosts.
    It is the API consumed by Funnel's official Terraform provider.
  humanURL: https://registry.terraform.io/providers/funnel-io/funnel/latest/docs
  baseURL: https://controlplane.setup.us.funnel.io/v1
  tags:
  - Marketing Data
  - Data Export
  - Configuration
  properties:
  - type: Authentication
    url: authentication/funnel-authentication.yml
  - type: Conventions
    url: conventions/funnel-conventions.yml
  - type: DataModel
    url: data-model/funnel-data-model.yml
  - type: ErrorCatalog
    url: errors/funnel-problem-types.yml
