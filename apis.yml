aid: funnel
name: Funnel
description: >-
  Funnel (funnel.io) is a marketing intelligence and marketing data hub that helps agencies and
  brands become more data-driven. It connects to hundreds of advertising, analytics, CRM, and social
  data platforms, then automatically collects, normalizes, and transforms that marketing data into a
  single, business-ready model. Funnel exports the harmonized data to cloud data warehouses
  (BigQuery, Snowflake), Google Cloud Storage, BI and visualization tools, and back to ad platforms,
  and layers on advanced marketing measurement (Marketing Mix Modeling and Multi-Touch Attribution)
  plus dashboards and reporting. Programmatic configuration is exposed through the Funnel Control
  Plane API, consumed via an official Terraform provider and an OAuth 2.0 client-credentials
  (Auth0) system-user flow, with regional US and EU data residency. Funnel also ships a first-party
  hosted MCP server (Funnel MCP) that exposes six read-only tools over OAuth to Claude, ChatGPT,
  Cursor and other MCP clients, plus a documented inbound file-import webhook API. Funnel publishes
  no OpenAPI or AsyncAPI for any of the three surfaces.
