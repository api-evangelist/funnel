notes: 'This is a genuine first-party hosted MCP server, not a derived candidate. Funnel markets it on
  its own product page (funnel.io/funnel-mcp), documents it in a dedicated help collection, and lists
  it as a feature on the pricing page for all plans. Both regional endpoints answered a live JSON-RPC
  tools/list with a well-formed MCP error, and both publish RFC 9728 protected-resource metadata anonymously.
  Note the surfaces do not overlap: Funnel MCP is read-only DATA access, while the Funnel Control Plane
  API is write CONFIGURATION management consumed by the Terraform provider. Neither is a projection of
  the other, so no tool crosswalk is emitted (there is also no published OpenAPI to bind tools to).'
