description: 'Funnel''s first-party hosted, remote MCP server. It exposes a Funnel workspace''s harmonized
  cross-channel marketing data, field/semantic definitions and workspace context to any MCP-compatible
  client (Claude, ChatGPT, Cursor, Copilot, Lovable, Perplexity, Notion). It is explicitly READ-ONLY:
  it reads data and definitions and cannot create or change data sources, fields, dashboards, exports
  or any other Funnel configuration.'
