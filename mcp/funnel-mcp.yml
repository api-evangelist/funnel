known_issues:
- id: query_data-empty-parameter-schema
  source: https://help.funnel.io/en/articles/15460006-troubleshoot-query_data-type-validation-errors-in-funnel-mcp
  detail: 'Funnel documents that its MCP server has published an incomplete parameter schema for query_data
    ("properties": {}), causing strict MCP clients to serialize array/object parameters as strings and
    the tool to reject them with type validation errors. Funnel states this is a server-side issue requiring
    a fix from Funnel. This is a provider-acknowledged contract defect in the MCP surface, not a client
    problem.'
infrastructure:
  note: The RFC 9728 metadata at the unsuffixed /.well-known/oauth-protected-resource path discloses that
    the servers are fronted by AWS Bedrock AgentCore gateways (funnel-mcp-us-*.gateway.bedrock-agentcore.us-east-1.amazonaws.com
    and funnel-mcp-eu-*.gateway.bedrock-agentcore.eu-central-1.amazonaws.com). Funnel-branded hostnames
    are the documented, supported entry points.
