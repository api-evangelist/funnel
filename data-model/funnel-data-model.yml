source: >-
  Terraform provider resources/data-sources (docs/resources/*, docs/data-sources/* in
  github.com/funnel-io/terraform-provider-funnel) — the documented Control Plane API entities —
  plus provider/funnel/funnel_client.go and provider/resources/*.go, which bind each entity to its
  real HTTP path segment and method.
api: Funnel Control Plane API
entities:
- name: subscription
  detail: Top-level tenant; scopes all other resources (subscription_id).
- name: workspace
  detail: A Funnel account/workspace within a subscription; container for data sources and exports.
  belongs_to: subscription
- name: data_source
  detail: A connected marketing/advertising data platform feeding a workspace.
  belongs_to: workspace
- name: custom_dimension
  detail: A user-defined dimension field in a workspace.
  belongs_to: workspace
- name: custom_metric
  detail: A user-defined metric field in a workspace.
  belongs_to: workspace
- name: export_field
  detail: A field (with export_name/export_type) selected for inclusion in an export.
  belongs_to: workspace
- name: bigquery_export
  detail: Export of harmonized data to Google BigQuery.
  belongs_to: workspace
- name: snowflake_export
  detail: Export of harmonized data to Snowflake.
  belongs_to: workspace
- name: gcs_export
  detail: Export of harmonized data to Google Cloud Storage.
  belongs_to: workspace
- name: measurement_export
  detail: Export to Funnel's measurement (MMM/MTA) destination.
  belongs_to: workspace
